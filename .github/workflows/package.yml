name: Adapter Package Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build adapters on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv build lightrag
      - run: uv build rag_anything
      # The contract/TCK suite is run by the parent integration repository
      # until canonical remote URLs for the internal Platform wheel exist.
      # This repository deliberately does not resolve an unpinned public
      # package name as a substitute for that internal dependency.
