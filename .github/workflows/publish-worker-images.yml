name: Publish Worker Runtime Images

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker runtime to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - lightrag
          - rag-anything

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-worker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: lightrag
            repository: SakuraWang6/LightRAG
            ref: rag-eval-worker-runtime-6eff0064
            revision: 6eff00641f2b4a1b6cfcecb85d7f35d6f79cb339
            runtime_path: rags/LightRAG
            dockerfile: evaluation-system/adapters/lightrag/Dockerfile
            image: ghcr.io/sakurawang6/rag-eval-worker-lightrag
            tag: 6eff0064-arm64
          - worker: rag-anything
            repository: HKUDS/RAG-Anything
            ref: v1.3.1
            revision: 698e4f178883e68baf6e566d0473e90f5e50daf5
            runtime_path: rags/RAG-Anything
            dockerfile: evaluation-system/adapters/rag-anything/Dockerfile
            image: ghcr.io/sakurawang6/rag-eval-worker-rag-anything
            tag: v1.3.1-arm64
    steps:
      - name: Select requested Worker
        id: selected
        shell: bash
        env:
          REQUESTED_WORKER: ${{ inputs.worker }}
          MATRIX_WORKER: ${{ matrix.worker }}
        run: |
          if [[ "${REQUESTED_WORKER}" == "all" || "${REQUESTED_WORKER}" == "${MATRIX_WORKER}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out Evaluation System
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evaluation-system
          persist-credentials: false

      - name: Check out immutable runtime source
        if: steps.selected.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.runtime_path }}
          persist-credentials: false

      - name: Verify immutable runtime revision
        if: steps.selected.outputs.enabled == 'true'
        shell: bash
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
          RUNTIME_PATH: ${{ matrix.runtime_path }}
        run: test "$(git -C "${RUNTIME_PATH}" rev-parse HEAD)" = "${EXPECTED_REVISION}"

      - name: Log in to GHCR
        if: steps.selected.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.selected.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable runtime image
        if: steps.selected.outputs.enabled == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/SakuraWang6/rag-evaluation-system
            org.opencontainers.image.revision=${{ matrix.revision }}
            org.opencontainers.image.title=RAG Evaluation ${{ matrix.worker }} Worker Runtime
          provenance: mode=max
          sbom: true
