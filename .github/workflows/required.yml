name: Engineering Signals

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: engineering-signals-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  PYTHON_BASELINE: "3.11.15"
  NODE_BASELINE: "24.12.0"

jobs:
  platform:
    name: platform / Python 3.11.15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run exact Platform baseline
        run: >-
          uv run --project platform --extra test --frozen
          --python "${PYTHON_BASELINE}"
          --with pytest==9.1.1 --with pyyaml==6.0.3
          python ci/pytest_signal_gate.py --section platform_pytest --profile ci
      - name: Verify exported schemas
        shell: bash
        run: |
          uv run --project platform --frozen --python "${PYTHON_BASELINE}" \
            rag-eval --home "${RUNNER_TEMP}/rag-eval" export-schemas "${RUNNER_TEMP}/schemas"
          diff -ru platform/schemas/2.0 "${RUNNER_TEMP}/schemas"

  ci-tooling:
    name: ci / policy tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Test executable CI policy tools
        run: >-
          uv run --no-project --python "${PYTHON_BASELINE}"
          --with pytest==9.1.1 --with pyyaml==6.0.3
          pytest -q ci/tests

  adapter-baseline:
    name: adapters / exact contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Validate exact all-green Adapter contract
        run: >-
          uv run --project adapters/lightrag --frozen
          --python "${PYTHON_BASELINE}"
          --with pytest==9.1.1 --with pytest-asyncio==1.4.0 --with pyyaml==6.0.3
          python ci/pytest_signal_gate.py --section adapter_pytest
      - name: Validate LightRAG native conformance
        run: >-
          uv run --project adapters/lightrag --frozen
          --python "${PYTHON_BASELINE}"
          --with pytest==9.1.1 --with pytest-asyncio==1.4.0 --with pyyaml==6.0.3
          python ci/pytest_signal_gate.py --section lightrag_native_pytest
      - name: Validate RAG-Anything native conformance
        run: >-
          uv run --project adapters/rag-anything --frozen
          --python "${PYTHON_BASELINE}"
          --with pytest==9.1.1 --with pytest-asyncio==1.4.0 --with pyyaml==6.0.3
          python ci/pytest_signal_gate.py --section rag_anything_pytest

  ruff-differential:
    name: platform / Ruff differential
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Reject new normalized diagnostics
        run: >-
          uv run --no-project --python "${PYTHON_BASELINE}"
          --with ruff==0.16.1 --with pyyaml==6.0.3
          python ci/check_ruff_differential.py

  package-build:
    name: packages / build and install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_BASELINE }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build wheels and source distributions
        shell: bash
        run: |
          uv build --package rag-eval-platform --out-dir dist/platform
          uv build --package rag-eval-adapter-lightrag --out-dir dist/lightrag
          uv build --package rag-eval-adapter-rag-anything --out-dir dist/rag-anything
      - name: Install artifacts in a clean environment
        shell: bash
        run: |
          uv venv "${RUNNER_TEMP}/package-smoke" --python "${PYTHON_BASELINE}"
          uv pip install --python "${RUNNER_TEMP}/package-smoke/bin/python" dist/platform/*.whl
          uv pip install --python "${RUNNER_TEMP}/package-smoke/bin/python" --no-deps \
            dist/lightrag/*.whl dist/rag-anything/*.whl
          "${RUNNER_TEMP}/package-smoke/bin/python" -c \
            "from pathlib import Path; import rag_eval, rag_eval_lightrag_adapter, rag_eval_rag_anything_adapter; assert (Path(rag_eval.__file__).parent / 'resources/benchmark-v0/BENCHMARK_PROTOCOL_V0.md').is_file()"
          "${RUNNER_TEMP}/package-smoke/bin/rag-eval" --help
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/**/*.whl
            dist/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  webui:
    name: webui / test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_BASELINE }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  worker-smoke:
    name: workers / ${{ matrix.worker }} lifecycle
    needs: package-build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        worker:
          - lightrag
          - rag-anything
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_BASELINE }}
          enable-cache: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download current distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Assemble candidate layer context
        id: candidate
        shell: bash
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          mkdir -p candidate/wheels
          cp dist/platform/*.whl candidate/wheels/
          cp "dist/${WORKER}"/*.whl candidate/wheels/
          base_image="$(uv run ci/run_worker_smoke.py --worker "${WORKER}" --print-locked-image)"
          candidate_image="rag-eval-candidate-${WORKER}:${GITHUB_SHA}"
          echo "base_image=${base_image}" >> "${GITHUB_OUTPUT}"
          echo "candidate_image=${candidate_image}" >> "${GITHUB_OUTPUT}"
      - name: Build current-wheel candidate image
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.candidate.outputs.base_image }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
        run: >-
          docker build --build-arg "BASE_IMAGE=${BASE_IMAGE}"
          --tag "${CANDIDATE_IMAGE}"
          --file ci/workers/Dockerfile.candidate candidate
      - name: Run model-free real Worker lifecycle
        env:
          WORKER: ${{ matrix.worker }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
        run: >-
          uv run ci/run_worker_smoke.py
          --worker "${WORKER}" --image "${CANDIDATE_IMAGE}" --pull never

  required:
    name: required / engineering-signals
    if: always()
    needs:
      - platform
      - ci-tooling
      - adapter-baseline
      - ruff-differential
      - package-build
      - webui
      - worker-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every engineering signal
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
          CI_TOOLING_RESULT: ${{ needs.ci-tooling.result }}
          ADAPTER_RESULT: ${{ needs.adapter-baseline.result }}
          RUFF_RESULT: ${{ needs.ruff-differential.result }}
          PACKAGE_RESULT: ${{ needs.package-build.result }}
          WEBUI_RESULT: ${{ needs.webui.result }}
          WORKER_RESULT: ${{ needs.worker-smoke.result }}
        shell: bash
        run: |
          for result in \
            "${PLATFORM_RESULT}" "${CI_TOOLING_RESULT}" \
            "${ADAPTER_RESULT}" "${RUFF_RESULT}" \
            "${PACKAGE_RESULT}" "${WEBUI_RESULT}" "${WORKER_RESULT}"; do
            test "${result}" = success
          done
