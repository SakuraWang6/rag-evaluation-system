[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-adapter-lightrag"
version = "0.1.0"
description = "Isolated LightRAG worker adapter for rag-eval-platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "rag-eval-platform>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_lightrag_adapter"]
